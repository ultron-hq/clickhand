<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d0f0a"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a3a"/>
      <stop offset="0.55" stop-color="#ff7a2f"/>
      <stop offset="1" stop-color="#ffb056"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#fff4e6"/>
      <stop offset="0.45" stop-color="#ffb056"/>
      <stop offset="1" stop-color="#ff4a3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- outer ring: four arcs with gaps at the cardinal points -->
  <g fill="none" stroke="url(#arc)" stroke-width="3.4" stroke-linecap="round">
    <path d="M14.4 23.2 A20 20 0 0 1 23.2 14.4"/>
    <path d="M40.8 14.4 A20 20 0 0 1 49.6 23.2"/>
    <path d="M49.6 40.8 A20 20 0 0 1 40.8 49.6"/>
    <path d="M23.2 49.6 A20 20 0 0 1 14.4 40.8"/>
  </g>
  <!-- cardinal ticks -->
  <g stroke="#ffb056" stroke-width="2.6" stroke-linecap="round">
    <path d="M32 7v6"/><path d="M32 51v6"/><path d="M7 32h6"/><path d="M51 32h6"/>
  </g>
  <!-- inner ring -->
  <circle cx="32" cy="32" r="11" fill="none" stroke="#ff7a2f" stroke-width="2" stroke-dasharray="5.2 2.4" opacity="0.85"/>
  <!-- glowing core -->
  <circle cx="32" cy="32" r="7.5" fill="url(#core)"/>
  <circle cx="32" cy="32" r="3" fill="#fff4e6"/>
</svg>
