[package]
name = "openhud"
description = "OpenHUD: an MCP server that lets Claude Code, Codex or any MCP agent see and use your desktop."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "openhud"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dirs = "6"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["shape"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3"
