<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="app.css"><title>Ask Clickhand</title></head>
<body>
<div class="bar">
  <form class="row" id="form" autocomplete="off">
    <img src="logo.png" alt="">
    <input id="q" placeholder="Ask Clickhand: start a 25 minute timer, open Spotify, teach me..." autofocus spellcheck="false">
    <kbd>Esc</kbd>
  </form>
  <div class="answer" id="answer" aria-live="polite"></div>
</div>
<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const q = document.getElementById("q"), answer = document.getElementById("answer");
let busy = false;
listen("bar-open", () => { if (!busy) { q.value = ""; answer.textContent = ""; answer.className = "answer"; } setTimeout(() => q.focus(), 30); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") invoke("hide_bar"); });
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text || busy) return;
  busy = true;
  answer.className = "answer thinking";
  answer.textContent = "Working on it";
  try {
    const out = await invoke("ask", { text });
    answer.className = "answer";
    answer.textContent = out;
  } catch (err) {
    answer.className = "answer err";
    answer.textContent = String(err);
  }
  busy = false;
});
</script>
</body></html>
