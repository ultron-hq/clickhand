[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/hands", "crates/desktop"]

[workspace.package]
edition = "2021"
version = "0.1.5"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ultron-hq/ultron"
rust-version = "1.85"

[workspace.dependencies]
fs4 = { version = "0.13", features = ["sync"] }
interprocess = "2"

[profile.dev]
# keep debug builds small: line tables are enough for backtraces
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
