name: mac-check
# What a Mac user sees: install with the public one-liner, open the app (welcome window),
# and open the .dmg (drag-to-Applications window). Screenshots are uploaded.
on:
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install with the one-liner
        run: curl -fsSL https://clickhand.vercel.app/mac.sh | sh
      - name: Welcome window
        run: |
          mkdir -p shots
          sleep 12
          ls -la /Applications/Clickhand.app/Contents/MacOS
          pgrep -fl clickhand || true
          screencapture -x shots/1-welcome.png
      - name: Broker started by the app
        run: |
          ls -la "$HOME/Library/Caches/clickhand/" || true
          test -S "$HOME/Library/Caches/clickhand/hands.sock" && echo "broker socket is up"
      - name: The disk image window
        run: |
          case "$(uname -m)" in arm64) a=apple-silicon ;; *) a=intel ;; esac
          curl -fsSL -o c.dmg "https://github.com/ultron-hq/ultron/releases/latest/download/Clickhand-mac-$a.dmg"
          open c.dmg
          sleep 10
          screencapture -x shots/2-dmg.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-${{ matrix.os }}
          path: shots
