name: release
# Push a tag like v0.1.0 to build ultron-hands for every platform and publish a release.
# The installers (getultron.vercel.app/install.sh and install.ps1) download from here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low, so the binary runs on older distros.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p ultron-hands --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=ultron-hands-${{ matrix.target }}
          dir=target/${{ matrix.target }}/release
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "dist/$name.zip" "./$dir/ultron-hands.exe" README.md LICENSE-MIT LICENSE-APACHE >/dev/null
            file="dist/$name.zip"
          else
            tar -czf "dist/$name.tar.gz" -C "$dir" ultron-hands -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE
            file="dist/$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" | cut -d' ' -f1 > "$file.sha256"
          else shasum -a 256 "$file" | cut -d' ' -f1 > "$file.sha256"; fi
      - name: Smoke test
        if: runner.os != 'Windows'
        run: target/${{ matrix.target }}/release/ultron-hands --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          notes="Install with one line:

          macOS / Linux: \`curl -fsSL https://getultron.vercel.app/install.sh | sh\`
          Windows (PowerShell): \`irm https://getultron.vercel.app/install.ps1 | iex\`

          Then follow the setup it starts. It connects Claude Code, Codex, Cursor, VS Code, Windsurf, Claude Desktop and Gemini CLI."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "Ultron Hands $TAG" --notes "$notes" -R "$GITHUB_REPOSITORY"
          fi
