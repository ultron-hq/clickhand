name: release
# Push a tag like v0.1.0 to build openhud for every platform and publish a release.
# The installers (openhud.vercel.app/install.sh and install.ps1) download from here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl builds run on every distro, Alpine and old glibc included.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p openhud --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=openhud-${{ matrix.target }}
          dir=target/${{ matrix.target }}/release
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "dist/$name.zip" "./$dir/openhud.exe" README.md LICENSE-MIT LICENSE-APACHE >/dev/null
            file="dist/$name.zip"
          else
            tar -czf "dist/$name.tar.gz" -C "$dir" openhud -C "$GITHUB_WORKSPACE" README.md LICENSE-MIT LICENSE-APACHE
            file="dist/$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$file" | cut -d' ' -f1 > "$file.sha256"
          else shasum -a 256 "$file" | cut -d' ' -f1 > "$file.sha256"; fi
      - name: Smoke test
        if: runner.os != 'Windows'
        run: target/${{ matrix.target }}/release/openhud --version
      - uses: actions/upload-artifact@v4
        with:
          name: hands-${{ matrix.target }}
          path: dist/*

  app:
    name: app (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: app }
          - { os: macos-15-intel, target: x86_64-apple-darwin, bundles: app }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf >/dev/null
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - run: cargo binstall -y --force tauri-cli@^2
      - name: Bundle OpenHUD inside the app
        shell: bash
        run: |
          cargo build --release --locked -p openhud --target ${{ matrix.target }}
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          mkdir -p crates/desktop/binaries
          cp "target/${{ matrix.target }}/release/openhud$ext" "crates/desktop/binaries/openhud-mcp-${{ matrix.target }}$ext"
      - name: Build the app
        working-directory: crates/desktop
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          b="target/${{ matrix.target }}/release/bundle"
          v="${GITHUB_REF_NAME#v}"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin|x86_64-apple-darwin)
              # dmgbuild lays out the window itself (Finder scripting fails on CI)
              pip3 install --quiet --break-system-packages dmgbuild 2>/dev/null || pip3 install --quiet dmgbuild
              [ "${{ matrix.target }}" = aarch64-apple-darwin ] && name=apple-silicon || name=intel
              dmgbuild -s crates/desktop/dmg/settings.py \
                -D app="$b/macos/OpenHUD.app" -D background=crates/desktop/icons/dmg-background.png \
                "OpenHUD" "dist/OpenHUD-mac-$name.dmg" ;;
            x86_64-pc-windows-msvc) cp "$b"/nsis/*.exe "dist/OpenHUD-windows-setup.exe" ;;
            *) cp "$b"/appimage/*.AppImage "dist/OpenHUD-linux.AppImage"; cp "$b"/deb/*.deb "dist/OpenHUD-linux.deb" ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hands-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          notes="Install with one line:

          macOS / Linux: \`curl -fsSL https://openhud.vercel.app/install.sh | sh\`
          Windows (PowerShell): \`irm https://openhud.vercel.app/install.ps1 | iex\`

          Then follow the setup it starts. It connects Claude Code, Codex, Cursor, VS Code, Windsurf, Claude Desktop and Gemini CLI.

          The OpenHUD app (flip-clock island + Ctrl+Space prompt bar, with Hands built in): the .dmg for Mac (drag it into Applications), -windows-setup.exe, or the Linux .AppImage / .deb."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "OpenHUD $TAG" --notes "$notes" -R "$GITHUB_REPOSITORY"
          fi

  publish-app:
    # Separate, so a failed app build never holds back the OpenHUD downloads.
    needs: [app, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: dist
          merge-multiple: true
      - name: Attach the app installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
