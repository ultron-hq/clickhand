name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Ultron did instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Ctrl+Space
        2. Type "..."
        3. ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux (X11), Linux (Wayland), Windows, macOS (Apple silicon), macOS (Intel)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ultron version
      description: Output of `ultron-rs --version`, or the commit.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the Ultron log. Remove anything personal.
      render: text
