name: Feature request
description: A new skill, provider, platform or idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The task or problem, in your words. "When I ..., I want Ultron to ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Ultron do it?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to build this myself
